- name: Setting up a local laptop
  hosts: linux
  connection: local
  # debugger: on_skipped
  debugger: on_failed
  roles:
    - role: gantsign.visual-studio-code
      users:
        - username: "{{ansible_facts['user_id']}}"
          visual_studio_code_extensions:
            - ms-python.python
    # Node currently breaks whe trying to install specific version
    # - role: stephdewit.nvm
    #  nvm_install_path: "/home/{{ansible_facts['user_id']}}/.nvm"
    #  nvm_shell_init_file: "/home/{{ansible_facts['user_id']}}/.bashrc"

    # Docker be done here since user needs to be in docker group and location of images is in home
    - role: docker
      vars:
        docker_group: "docker"
        docker_user: "{{ ansible_facts['user_id'] }}"
      become: true

  tasks:
    - name: Zotero
      ansible.builtin.include_tasks: roles/uncommon/tasks/zotero.yml
    # Firefox Developer Edition
    - name: FirefoxDeveloper
      ansible.builtin.include_tasks: roles/uncommon/tasks/firefox-developer.yml
    # Firefox Developer Edition
    - name: ForceQuit
      ansible.builtin.include_tasks: roles/uncommon/tasks/force_quit.yml
    # Conda should be per user
    - name: Miniforge
      ansible.builtin.include_tasks: roles/python/tasks/miniforge.yml
