---
- name: Install Zoom on Ubuntu
  become: true
  vars:
    download_url: "https://cdn.zoom.us/prod/6.7.5.6891/zoom_amd64.deb"
    temp_dir: "/tmp/zoom_install"

  block:
    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ temp_dir }}"
        state: directory
        mode: "0755"

    - name: Download Zoom deb package
      ansible.builtin.get_url:
        url: "{{ download_url }}"
        dest: "{{ temp_dir }}/zoom_amd64.deb"
        mode: "0644"
      register: zoom_download_result

    - name: Add the Zoom PGP key
      ansible.builtin.get_url:
        url: https://zoom.us/linux/download/pubkey?version=6-7-5
        dest: "{{ temp_dir }}/package-signing-key-6-7-5.pub"
        mode: '0644'

    - name: Install Zoom
      become: true
      ansible.builtin.apt:
        deb: "{{ temp_dir }}/zoom_amd64.deb"
        state: present
      when: zoom_download_result is succeeded

    - name: Clean up downloaded package
      ansible.builtin.file:
        path: "{{ temp_dir }}"
        state: absent

    - name: Verify Zoom installation
      ansible.builtin.command: which zoom
      register: zoom_check
      changed_when: false
      failed_when: false

    - name: Display installation status
      ansible.builtin.debug:
        msg: "Zoom installed successfully at {{ positron_check.stdout }}"
      when: zoom_check.rc == 0
