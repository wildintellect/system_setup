- name: Setting up a local laptop
  hosts: linux
  connection: local
  become: true
  # debugger: on_skipped
  debugger: on_failed
  roles:
    - role: common
      when: ansible_facts['os_family'] == 'Debian'
    - role: uncommon
      when: ansible_facts['os_family'] == 'Debian'
    - role: graphics
      when: ansible_facts['os_family'] == 'Debian'
    - role: geospatial
      when: ansible_facts['os_family'] == 'Debian'
    - role: r
      when: ansible_facts['os_family'] == 'Debian'
