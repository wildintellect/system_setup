- name: Laptop
  hosts: 127.0.0.1
  become: true
  pre_tasks:
    - name: Update repositories
      apt:
          update_cache=yes
          upgrade=dist # to resolve the warning message "Could not find aptitude. Using apt-get instead"
      changed_when: false

  tasks:
    - name: Ubuntu package install upgrade
      include_tasks: tasks/packages.yml
      tags: finished

    - name: install R
      include_tasks: tasks/installR.yml
      tags: finished

    - name: install RStudio
      include_tasks: tasks/installRstudio.yml
      tags: finished

    - name: install slack
      include_tasks: tasks/installSlack.yml
      tags: finished

    - name: install chrome
      include_tasks: tasks/installChrome.yml
      tags: finished

    - name: install r dependencies
      include_tasks: tasks/installRdependencies.yml
      tags: finished

    - name: install Google Earth
      include_tasks: tasks/installGoogleEarth.yml
      tags: finished

    - name: install QGIS
      include_tasks: tasks/installQGIS.yml
      tags: finished

